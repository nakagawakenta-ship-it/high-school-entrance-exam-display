name: Exam question horizon audit
on:
  push:
    paths:
      - 'scripts/audit_question_horizon.py'
      - 'scripts/expanded_question_bank.py'
      - 'prepared/*.json'
      - 'daily.json'
      - 'daily/*.json'
      - '.github/workflows/question-quality-audit.yml'
  schedule:
    - cron: '10 21 * * *' # 06:10 JST
  workflow_dispatch:
  workflow_run:
    workflows:
      - Prepare exam questions through February 2027
    types:
      - completed
permissions:
  contents: read
jobs:
  audit:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Audit all dates to February 2027
        run: python scripts/audit_question_horizon.py
      - name: Preserve audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exam-question-audit
          path: question_quality_audit.json
