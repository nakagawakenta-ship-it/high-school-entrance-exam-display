name: Generate e-paper display data

on:
  workflow_dispatch:
  push:
    paths:
      - daily.json
      - scripts/generate_display.py

permissions:
  contents: write

concurrency:
  group: generate-epaper-display
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install pillow

      - name: Generate e-paper files
        run: python scripts/generate_display.py

      - name: Commit generated files safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add display.bin display_preview.png
          if git diff --cached --quiet; then
            echo "No display changes"
            exit 0
          fi
          git commit -m "Generate e-paper display data"
          git pull --rebase origin main
          git push origin main
