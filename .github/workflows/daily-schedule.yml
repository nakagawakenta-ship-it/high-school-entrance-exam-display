name: Daily e-paper schedule

on:
  schedule:
    - cron: '25 20 * * *' # 05:25 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select today's prepared questions
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%F)
          FILE="daily/$TODAY.json"
          echo "JST date: $TODAY"
          if [ ! -f "$FILE" ]; then
            echo "Prepared question file not found: $FILE"
            exit 1
          fi
          cp "$FILE" daily.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install pillow

      - name: Generate e-paper files
        run: python scripts/generate_display.py

      - name: Commit today's files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily.json display.bin display_preview.png
          git diff --cached --quiet || git commit -m "Daily e-paper update $(TZ=Asia/Tokyo date +%F)"
          git push
