name: Daily e-paper schedule

on:
  schedule:
    - cron: '0 19 * * *'   # 04:00 JST primary
    - cron: '0 20 * * *'   # 05:00 JST retry
    - cron: '0 21 * * *'   # 06:00 JST final retry
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-epaper
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Select prepared questions first; generate only as fallback
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%F)
          FILE="daily/$TODAY.json"
          echo "JST date: $TODAY"
          if [ -f "$FILE" ]; then
            echo "Using prepared reviewed file: $FILE"
            cp "$FILE" daily.json
          else
            echo "Prepared file missing; using generator fallback"
            python scripts/generate_daily_questions.py
          fi

      - name: Validate question set
        run: |
          python - <<'PY'
          import json, datetime, zoneinfo
          d=json.load(open('daily.json',encoding='utf-8'))
          today=datetime.datetime.now(zoneinfo.ZoneInfo('Asia/Tokyo')).date().isoformat()
          assert d['date']==today, (d['date'],today)
          qs=d['questions']; assert len(qs)==10
          assert sum(q['subject']=='english' for q in qs)==5
          assert sum(q['subject']=='social' for q in qs)==5
          assert len({q['question'] for q in qs})==10
          for q in qs:
              assert len(q.get('choices',[]))==4 and q.get('answer') in q['choices']
          print('Validation OK:',today)
          PY

      - name: Install display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install pillow

      - name: Generate e-paper files
        run: python scripts/generate_display.py

      - name: Commit today's files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily.json daily/ display.bin display_preview.png
          git diff --cached --quiet || git commit -m "Daily e-paper update $(TZ=Asia/Tokyo date +%F)"
          git pull --rebase origin main
          git push
