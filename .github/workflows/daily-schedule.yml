name: Daily e-paper schedule

on:
  schedule:
    - cron: '25 20 * * *' # 05:25 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate today's unique questions
        run: |
          python scripts/generate_daily_questions.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install pillow

      - name: Generate e-paper files
        run: python scripts/generate_display.py

      - name: Commit today's files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily.json daily/ display.bin display_preview.png
          git diff --cached --quiet || git commit -m "Daily e-paper update $(TZ=Asia/Tokyo date +%F)"
          git push
