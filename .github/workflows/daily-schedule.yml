name: Daily e-paper update

on:
  push:
    paths:
      - 'scripts/generate_diverse_daily.py'
      - 'scripts/expanded_question_bank.py'
      - 'prepared/*.json'
      - '.github/workflows/daily-schedule.yml'
  schedule:
    - cron: '0 15 * * *'   # 00:00 JST: prepare today's display well before wake-up
    - cron: '0 17 * * *'   # 02:00 JST: backup generation
    - cron: '30 18 * * *'  # 03:30 JST: backup generation
    - cron: '0 19 * * *'   # 04:00 JST: early-morning refresh
    - cron: '30 19 * * *'  # 04:30 JST: backup refresh
    - cron: '0 20 * * *'   # 05:00 JST: pre-wake refresh
    - cron: '15 20 * * *'  # 05:15 JST: final pre-wake refresh
    - cron: '30 20 * * *'  # 05:30 JST: scheduled refresh
    - cron: '45 20 * * *'  # 05:45 JST: post-wake fallback
    - cron: '0 21 * * *'   # 06:00 JST: late fallback
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'daily-epaper-${{ github.ref_name }}'
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install pillow

      - name: Generate today's questions
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%F)
          if [[ "$TODAY" > "2026-10-19" && -f "prepared/${TODAY}.json" ]]; then
            cp "prepared/${TODAY}.json" daily.json
            mkdir -p daily
            cp "prepared/${TODAY}.json" "daily/${TODAY}.json"
            echo "Using pre-generated and audited questions for ${TODAY}"
          else
            python scripts/generate_diverse_daily.py
          fi

      - name: Validate today's data
        run: |
          python - <<'PY'
          import json, datetime, zoneinfo, pathlib
          today=datetime.datetime.now(zoneinfo.ZoneInfo('Asia/Tokyo')).date().isoformat()
          d=json.load(open('daily.json',encoding='utf-8'))
          assert d['date']==today, (d['date'],today)
          qs=d['questions']
          assert len(qs)==10
          assert sum(q['subject']=='english' for q in qs)==5
          assert sum(q['subject']=='social' for q in qs)==5
          assert len({q['question'] for q in qs})==10
          for q in qs:
              choices=q.get('choices',[])
              assert len(choices)==4, (q.get('id'), 'expected four choices')
              assert len(set(choices))==4, (q.get('id'), 'duplicate choices')
              assert q.get('answer') in choices, (q.get('id'), 'answer missing from choices')
          ids=[q.get('id') for q in qs if q.get('id')]
          assert len(ids)==len(set(ids)), 'duplicate question IDs'
          assert pathlib.Path(f'daily/{today}.json').exists()
          print('VALIDATED',today)
          PY

      # Keep the complete date-range audit in the daily path, not only on its separate schedule.
      - name: Audit full question horizon
        run: |
          # Preserve the audit script's exit code; tee alone otherwise masks failures.
          set +e
          python scripts/audit_question_horizon.py | tee /tmp/question-audit-summary.json
          audit_status=${PIPESTATUS[0]}
          set -e
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/question-audit-summary.json',encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write("## 日次更新時の全期間品質監査\\n\\n")
              f.write(f"- 対象期間: {d['start']}〜{d['end']}\\n")
              f.write(f"- 検査: {d['days_checked']}日 / {d['questions_checked']}問\\n")
              f.write(f"- 未来事前生成: {d['prepared_future_days_checked']}日\\n")
              f.write(f"- 判定: **{d['quality_status']}**\\n")
              f.write(f"- 完全一致重複: {d['exact_duplicate_group_count']}\\n")
              f.write(f"- 類似テンプレート群: {d['template_duplicate_group_count']}\\n")
              f.write(f"- 類似候補ペア: {d['near_duplicate_pair_count']}\\n")
              f.write(f"- 構造エラー: {len(d['errors'])}\\n")
              f.write(f"- 内容警告: {d['content_warning_count']}\\n")
              if d['quality_status'] != 'pass':
                  f.write("\\n> 類似候補はレビュー対象です。構造エラー・既知の内容警告がある場合、このステップは失敗します。\\n")
          PY
          if [[ "$audit_status" -ne 0 ]]; then
            echo "::error::Full-horizon question audit failed (exit code $audit_status). See question_quality_audit.json artifact."
            exit "$audit_status"
          fi

      - name: Preserve daily quality audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-question-quality-audit
          path: question_quality_audit.json
          if-no-files-found: warn
          retention-days: 30

      - name: Generate display
        run: |
          python scripts/generate_display.py
          test "$(stat -c%s display.bin)" -eq 48000
          echo "DISPLAY_OK 48000 bytes"

      - name: Commit and push atomically
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily.json daily/ display.bin display_preview.png
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Daily e-paper update $(TZ=Asia/Tokyo date +%F)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 10
          done
          exit 1
