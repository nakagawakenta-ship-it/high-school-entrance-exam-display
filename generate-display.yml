name: Generate e-paper display data

on:
  workflow_dispatch:
  push:
    paths:
      - daily.json
      - scripts/generate_display.py

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install pillow
      - run: python scripts/generate_display.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add display.bin display_preview.png
          git diff --cached --quiet || git commit -m 'Generate e-paper display data'
          git push
